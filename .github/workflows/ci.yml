name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compaction_audit.py self-test against known fixtures
        run: python3 compaction_audit.py --self-test
      - name: single-window and json modes
        run: |
          python3 compaction_audit.py fixtures/sample.jsonl --only 2 | grep "window 2 of 2"
          python3 compaction_audit.py fixtures/sample.jsonl --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(list(d.values())[0])==2"
      - name: a directory with no compactions exits clean
        run: |
          mkdir -p /tmp/empty && echo '{"type":"user","message":{"content":"hi"}}' > /tmp/empty/s.jsonl
          python3 compaction_audit.py /tmp/empty | grep "never ran out of room"
